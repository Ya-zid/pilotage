name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, type-check, leak scan, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      # node:test suites: temp data dirs, fake home folders, spare ports, no AI, no forwarder.
      - name: Server tests
        run: npm test

      - name: Type-check the web app
        run: npm --prefix web run typecheck

      # Generic checks only here: the private pattern list never leaves the maintainer's machine.
      - name: Leak scan
        run: npm run leak-scan

      # `npm run build` would type-check again; the step above already did.
      - name: Build the web app
        working-directory: web
        run: npx vite build

  # The npm package as users get it (npm pack → global install → start), on Linux and macOS. On macOS the tests also
  # open the real Terminal.app once (with a fake claude) and the smoke test installs and removes the LaunchAgent.
  package:
    name: npm package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm ci && npm ci --prefix web

      - name: Server tests (macOS)
        if: runner.os == 'macOS'
        run: npm test
        env:
          PILOTAGE_TEST_TERMINAL_APP: '1'

      - name: Pack, install and run the package
        run: bash scripts/smoke-npm.sh
